version = 1

[[annotations]]
path = [
    ".mailmap",
    ".tool_versions.yaml",
    "pubspec.lock",
    "*.json",
    ".vscode/**",
    "lib/l10n/**",
    "assets/vodozemac/**",
    ".github/**",
    ".gitignore",
    ".metadata",
    "android/**",
    "ios/**",
    "linux/**",
    "macos/**",
    "integration_test/.gitignore",
    "integration_test/data/**",
    "integration_test/synapse/**",
    "snap/**",
    "windows/**",
    "web/**"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2019-Present Christian Kußowski"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = [
    "assets/sounds/**"
]
SPDX-FileCopyrightText = "Pixabay"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = [
    "assets/sas-emoji.json"
]
SPDX-FileCopyrightText = "Matrix Foundation"
SPDX-License-Identifier = "Apache-2.0"

# App Logo
[[annotations]]
path = [
    "assets/logo/**",
    "android/app/src/main/res/mipmap**/**",
    "ios/Runner/Assets.xcassets/AppIcon.appiconset/**",
    "macos/Runner/Assets.xcassets/AppIcon.appiconset/**",
    "web/icons/**",
    "web/splash/**",
    "snap/gui/*.png",
    "windows/runner/resources/app_icon.ico"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2017-Present Fabiyamada"
SPDX-License-Identifier = "CC-BY-4.0"
# Roadmatics artwork and generated mobile assets
[[annotations]]
path = ["assets/roadmatics/**", "android/app/src/main/res/drawable-*/splash.png", "android/app/src/main/res/drawable-*/notifications_icon.png", "android/app/src/main/res/drawable-*/ic_launcher_foreground.png", "android/app/src/main/res/drawable-*/ic_launcher_monochrome.png", "android/app/src/main/res/mipmap-*/ic_launcher.png", "ios/Runner/Assets.xcassets/AppIcon.appiconset/*.png", "ios/Runner/Assets.xcassets/LaunchImage.imageset/*.png"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Roadmatics Technologies"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = ["Roadmatics_Chat_FluffyChat_PRD.md", ".gitleaksignore"]
