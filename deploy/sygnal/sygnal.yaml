http:
  bind_addresses: ['127.0.0.1']
  port: 5000

apps:
  'com.roadmatics.chat.*':
    type: gcm
    api_version: v1
    project_id: roadrnext-56471
    service_account_file: /etc/sygnal/firebase-roadmatics.json
    send_badge_counts: false

metrics:
  prometheus:
    enabled: false
  opentracing:
    enabled: false
  sentry:
    enabled: false

log:
  setup:
    version: 1
    disable_existing_loggers: false
    formatters:
      normal:
        format: '%(levelname)s %(name)s %(message)s'
    handlers:
      stderr:
        class: logging.StreamHandler
        formatter: normal
        stream: ext://sys.stderr
    root:
      level: INFO
      handlers: [stderr]
    loggers:
      # Upstream GCM retry/failure logs may include raw registration tokens.
      sygnal.gcmpushkin:
        level: CRITICAL
        propagate: false
        handlers: [stderr]
      # Dispatch exceptions may include provider payloads; retain status-only
      # access logs without those exception messages.
      sygnal.http:
        level: CRITICAL
        propagate: false
        handlers: [stderr]
      sygnal.access:
        level: INFO
        propagate: false
        handlers: [stderr]
  access:
    x_forwarded_for: false
